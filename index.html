<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>ICT DAY | Mansoura College - Royal Invitation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-dark: #071B20;
        --bg-deep: #0B272B;
        --gold-royal: #D6AD46;
        --gold-light: #EFD270;
        --turquoise: #19767A;
        --crimson: #8D2929;
        --ivory: #F4DF9B;
        --white: #FFFFFF;

        --font-display: 'Cinzel', serif;
        --font-sans: 'Plus Jakarta Sans', sans-serif;
        --font-ar: 'Cairo', sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100dvh;
        max-height: 100dvh;
        overflow: hidden;
        background-color: var(--bg-dark);
        color: var(--white);
        font-family: var(--font-ar);
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }

      /* ===== الحاوية الرئيسية بدون أي Scroll ===== */
      .ict-viewport {
        position: relative;
        width: 100%;
        height: 100dvh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 45%, var(--bg-deep) 0%, var(--bg-dark) 75%);
        padding: 20px 16px;
      }

      /* ===== الخلفية الفرعونية التكنولوجية ===== */
      .bg-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 0;
      }

      .bg-tech-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(214, 173, 70, 0.04) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(214, 173, 70, 0.04) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: radial-gradient(circle at center, black 35%, transparent 82%);
        -webkit-mask-image: radial-gradient(circle at center, black 35%, transparent 82%);
      }

      .bg-glow-gold {
        position: absolute;
        top: 50%;
        left: 50%;
        width: min(680px, 95vw);
        height: min(680px, 95vw);
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(214, 173, 70, 0.11) 0%, rgba(214, 173, 70, 0.02) 45%, transparent 72%);
      }

      .bg-glow-turquoise {
        position: absolute;
        bottom: -15%;
        right: -10%;
        width: min(560px, 80vw);
        height: min(560px, 80vw);
        background: radial-gradient(circle, rgba(25, 118, 122, 0.16) 0%, transparent 70%);
      }

      .bg-sacred-rings {
        position: absolute;
        top: 50%;
        left: 50%;
        width: min(760px, 115vw);
        height: min(760px, 115vw);
        transform: translate(-50%, -50%);
        opacity: 0.14;
      }

      .screen-frame-top,
      .screen-frame-bottom {
        position: absolute;
        left: 0;
        right: 0;
        z-index: 2;
        pointer-events: none;
        display: flex;
        flex-direction: column;
      }

      .screen-frame-top {
        top: 0;
      }

      .screen-frame-bottom {
        bottom: 0;
        flex-direction: column-reverse;
      }

      .frame-gold-line {
        height: 2px;
        width: 100%;
        background: linear-gradient(90deg, transparent 2%, var(--gold-royal) 25%, var(--gold-light) 50%, var(--gold-royal) 75%, transparent 98%);
        opacity: 0.85;
      }

      .frame-frieze {
        height: 6px;
        width: 100%;
        opacity: 0.72;
        background-image: repeating-linear-gradient(
          90deg,
          var(--gold-royal) 0px,
          var(--gold-royal) 16px,
          transparent 16px,
          transparent 20px,
          var(--turquoise) 20px,
          var(--turquoise) 36px,
          transparent 36px,
          transparent 40px,
          var(--crimson) 40px,
          var(--crimson) 52px,
          transparent 52px,
          transparent 56px
        );
      }

      /* ===== المرحلة الأولى: بطاقة الدعوة المغلقة ===== */
      .stage-wrapper {
        position: relative;
        z-index: 3;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 1400px;
      }

      .cover-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        width: 100%;
        max-height: 100%;
      }

      .royal-card {
        position: relative;
        width: min(370px, 88vw);
        padding: 26px 22px 24px;
        background: linear-gradient(165deg, rgba(11, 39, 43, 0.96) 0%, rgba(7, 27, 32, 0.99) 100%);
        border: 1.5px solid var(--gold-royal);
        border-radius: 6px 6px 26px 26px;
        box-shadow:
          0 24px 60px rgba(0, 0, 0, 0.6),
          0 0 38px rgba(214, 173, 70, 0.16),
          inset 0 0 28px rgba(25, 118, 122, 0.12);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        transform-style: preserve-3d;
        outline: none;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
      }

      .royal-card:hover,
      .royal-card:focus-visible {
        border-color: var(--gold-light);
        box-shadow:
          0 28px 70px rgba(0, 0, 0, 0.68),
          0 0 48px rgba(239, 210, 112, 0.26),
          inset 0 0 32px rgba(25, 118, 122, 0.18);
      }

      .card-pylon-cap {
        position: absolute;
        top: -1px;
        left: -1px;
        right: -1px;
        height: 12px;
        background: linear-gradient(90deg, var(--gold-royal), var(--gold-light), var(--gold-royal));
        clip-path: polygon(0 0, 100% 0, 96% 100%, 4% 100%);
        opacity: 0.95;
      }

      .card-inner-border {
        position: absolute;
        inset: 10px;
        border: 1px solid rgba(214, 173, 70, 0.32);
        border-radius: 4px 4px 20px 20px;
        pointer-events: none;
      }

      .corner-ornament {
        position: absolute;
        width: 18px;
        height: 18px;
        border-color: var(--gold-light);
        border-style: solid;
        pointer-events: none;
        opacity: 0.85;
      }
      .corner-tl { top: 16px; left: 16px; border-width: 2px 0 0 2px; }
      .corner-tr { top: 16px; right: 16px; border-width: 2px 2px 0 0; }
      .corner-bl { bottom: 16px; left: 16px; border-width: 0 0 2px 2px; border-bottom-left-radius: 10px; }
      .corner-br { bottom: 16px; right: 16px; border-width: 0 2px 2px 0; border-bottom-right-radius: 10px; }

      .card-eye-wrap {
        margin-top: 8px;
        margin-bottom: 12px;
        width: 68px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card-college {
        font-family: var(--font-sans);
        font-size: clamp(0.68rem, 1.8vw, 0.78rem);
        font-weight: 700;
        letter-spacing: 0.24em;
        color: var(--ivory);
        opacity: 0.92;
        margin-bottom: 4px;
      }

      .card-subtitle {
        font-family: var(--font-display);
        font-size: clamp(0.75rem, 2vw, 0.85rem);
        font-weight: 600;
        letter-spacing: 0.22em;
        color: var(--gold-royal);
        margin-bottom: 16px;
      }

      .card-divider {
        width: 72%;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--gold-royal), transparent);
        margin: 0 auto 16px;
        position: relative;
      }

      .card-divider::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 7px;
        height: 7px;
        background: var(--gold-light);
        transform: translate(-50%, -50%) rotate(45deg);
      }

      .card-title {
        font-family: var(--font-display);
        font-size: clamp(2.1rem, 6vw, 2.75rem);
        font-weight: 800;
        letter-spacing: 0.12em;
        line-height: 1.05;
        margin-bottom: 12px;
        direction: ltr;
      }

      .card-title-ict {
        color: var(--gold-light);
        text-shadow: 0 0 22px rgba(214, 173, 70, 0.35);
      }

      .card-title-day {
        color: var(--white);
      }

      .card-pillars {
        font-family: var(--font-sans);
        font-size: clamp(0.6rem, 1.5vw, 0.68rem);
        font-weight: 600;
        letter-spacing: 0.15em;
        color: var(--gold-royal);
        margin-bottom: 18px;
        direction: ltr;
      }

      .card-meta-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 6px 14px;
        border-radius: 999px;
        border: 1px solid rgba(25, 118, 122, 0.65);
        background: rgba(25, 118, 122, 0.15);
        font-family: var(--font-sans);
        font-size: clamp(0.64rem, 1.6vw, 0.72rem);
        font-weight: 600;
        letter-spacing: 0.12em;
        color: var(--ivory);
        margin-bottom: 22px;
        direction: ltr;
      }

      .open-btn {
        width: 100%;
        max-width: 230px;
        padding: 12px 20px;
        border: none;
        border-radius: 6px;
        background: linear-gradient(135deg, var(--gold-royal) 0%, var(--gold-light) 50%, var(--gold-royal) 100%);
        color: var(--bg-dark);
        font-family: var(--font-sans);
        font-size: clamp(0.75rem, 1.9vw, 0.84rem);
        font-weight: 800;
        letter-spacing: 0.16em;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(214, 173, 70, 0.28);
        transition: transform 0.2s ease, filter 0.2s ease;
      }

      .royal-card:hover .open-btn {
        filter: brightness(1.06);
        transform: translateY(-1px);
      }

      .cover-hint {
        font-family: var(--font-ar);
        font-size: clamp(0.84rem, 2.2vw, 0.96rem);
        font-weight: 600;
        color: var(--ivory);
        opacity: 0.88;
      }

      /* ===== المرحلة الثانية: لوحة الدعوة الرئيسية ===== */
      .invitation-panel {
        position: relative;
        width: min(1000px, 92vw);
        max-height: calc(100dvh - 44px);
        background: linear-gradient(155deg, rgba(11, 39, 43, 0.96) 0%, rgba(7, 27, 32, 0.98) 100%);
        border: 1.5px solid var(--gold-royal);
        border-radius: 14px;
        box-shadow:
          0 26px 70px rgba(0, 0, 0, 0.62),
          0 0 42px rgba(214, 173, 70, 0.14);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .panel-top-frieze {
        height: 8px;
        width: 100%;
        flex-shrink: 0;
        background-image: repeating-linear-gradient(
          90deg,
          var(--gold-royal) 0px,
          var(--gold-royal) 20px,
          var(--bg-dark) 20px,
          var(--bg-dark) 23px,
          var(--turquoise) 23px,
          var(--turquoise) 43px,
          var(--bg-dark) 43px,
          var(--bg-dark) 46px,
          var(--crimson) 46px,
          var(--crimson) 60px,
          var(--bg-dark) 60px,
          var(--bg-dark) 63px
        );
        border-bottom: 1px solid rgba(214, 173, 70, 0.5);
      }

      .panel-body {
        position: relative;
        padding: clamp(20px, 3.2vw, 38px) clamp(20px, 3.8vw, 44px);
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        gap: clamp(20px, 3.5vw, 44px);
        align-items: center;
      }

      .hero-col {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        text-align: left;
      }

      .hero-top-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
      }

      .hero-eye {
        width: 44px;
        height: 28px;
        flex-shrink: 0;
      }

      .invited-label {
        font-family: var(--font-sans);
        font-size: clamp(0.68rem, 1.4vw, 0.78rem);
        font-weight: 700;
        letter-spacing: 0.26em;
        color: var(--gold-royal);
      }

      .main-title {
        font-family: var(--font-display);
        font-size: clamp(2.2rem, 5vw, 3.85rem);
        font-weight: 800;
        line-height: 1;
        letter-spacing: 0.08em;
        margin-bottom: 12px;
        direction: ltr;
      }

      .main-title-ict {
        color: var(--gold-light);
      }

      .main-title-day {
        color: var(--white);
      }

      .hero-tagline {
        font-family: var(--font-ar);
        font-size: clamp(0.95rem, 1.8vw, 1.2rem);
        font-weight: 700;
        color: var(--ivory);
        line-height: 1.45;
        margin-bottom: 10px;
        width: 100%;
        text-align: right;
        direction: rtl;
      }

      .hero-desc {
        font-family: var(--font-ar);
        font-size: clamp(0.82rem, 1.4vw, 0.95rem);
        font-weight: 400;
        color: rgba(255, 255, 255, 0.84);
        line-height: 1.65;
        width: 100%;
        text-align: right;
        direction: rtl;
        margin-bottom: 16px;
      }

      .hero-pillars-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 999px;
        border: 1px solid rgba(214, 173, 70, 0.35);
        background: rgba(214, 173, 70, 0.08);
        font-family: var(--font-ar);
        font-size: clamp(0.72rem, 1.3vw, 0.82rem);
        font-weight: 600;
        color: var(--gold-light);
        align-self: flex-end;
        direction: rtl;
      }

      .details-col {
        display: flex;
        flex-direction: column;
        gap: 12px;
        border-left: 1px solid rgba(214, 173, 70, 0.2);
        padding-left: clamp(16px, 2.8vw, 34px);
      }

      .details-heading {
        font-family: var(--font-sans);
        font-size: clamp(0.7rem, 1.3vw, 0.78rem);
        font-weight: 700;
        letter-spacing: 0.24em;
        color: var(--gold-royal);
        margin-bottom: 2px;
      }

      .details-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .detail-card {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(7, 27, 32, 0.72);
        border: 1px solid rgba(214, 173, 70, 0.26);
        direction: rtl;
        text-align: right;
        min-width: 0;
      }

      .detail-icon-box {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        background: rgba(214, 173, 70, 0.14);
        border: 1px solid rgba(214, 173, 70, 0.4);
        color: var(--gold-light);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .detail-text {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .detail-label {
        font-family: var(--font-ar);
        font-size: 0.7rem;
        font-weight: 600;
        color: var(--gold-royal);
        line-height: 1.2;
      }

      .detail-value {
        font-family: var(--font-ar);
        font-size: clamp(0.78rem, 1.35vw, 0.9rem);
        font-weight: 700;
        color: var(--white);
        line-height: 1.35;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .rsvp-slot {
        height: 46px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 4px;
      }

      .rsvp-loading {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        height: 44px;
        padding: 0 14px;
        border-radius: 10px;
        border: 1px solid rgba(214, 173, 70, 0.28);
        background: rgba(214, 173, 70, 0.06);
        color: var(--ivory);
        font-size: clamp(0.78rem, 1.4vw, 0.88rem);
        font-weight: 600;
        direction: rtl;
      }

      .rsvp-spinner {
        width: 17px;
        height: 17px;
        border-radius: 50%;
        border: 2px solid rgba(239, 210, 112, 0.25);
        border-top-color: var(--gold-light);
        animation: spin 0.8s linear infinite;
        flex-shrink: 0;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .rsvp-success {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        width: 100%;
        height: 44px;
        padding: 0 14px;
        border-radius: 10px;
        border: 1px solid var(--gold-royal);
        background: linear-gradient(90deg, rgba(25, 118, 122, 0.28), rgba(214, 173, 70, 0.16));
        color: var(--white);
        font-size: clamp(0.8rem, 1.4vw, 0.92rem);
        font-weight: 700;
        box-shadow: 0 0 20px rgba(214, 173, 70, 0.14);
        direction: rtl;
      }

      .rsvp-success-icon {
        color: var(--gold-light);
        flex-shrink: 0;
      }

      .replay-row {
        display: flex;
        justify-content: center;
        margin-top: 2px;
      }

      .replay-btn {
        background: transparent;
        border: 1px solid rgba(214, 173, 70, 0.26);
        border-radius: 999px;
        padding: 5px 14px;
        color: rgba(244, 223, 155, 0.78);
        font-family: var(--font-ar);
        font-size: 0.74rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .replay-btn:hover {
        color: var(--gold-light);
        border-color: var(--gold-royal);
        background: rgba(214, 173, 70, 0.08);
      }

      /* ===== التجاوب مع التابلت والهواتف ===== */
      @media (max-width: 880px) {
        .ict-viewport {
          padding: 14px 12px;
        }
        .panel-body {
          grid-template-columns: 1fr;
          gap: 14px;
          padding: 18px 18px 16px;
        }
        .hero-col {
          align-items: center;
          text-align: center;
        }
        .hero-top-row {
          justify-content: center;
          margin-bottom: 6px;
        }
        .hero-tagline,
        .hero-desc {
          text-align: center;
        }
        .hero-desc {
          margin-bottom: 10px;
        }
        .hero-pillars-chip {
          align-self: center;
        }
        .details-col {
          border-left: none;
          padding-left: 0;
          border-top: 1px solid rgba(214, 173, 70, 0.22);
          padding-top: 12px;
          gap: 10px;
        }
        .details-heading {
          text-align: center;
        }
      }

      @media (max-width: 520px), (max-height: 700px) {
        .ict-viewport {
          padding: 10px 10px;
        }
        .cover-container {
          gap: 10px;
        }
        .royal-card {
          width: min(320px, 88vw);
          padding: 18px 16px 16px;
          border-radius: 6px 6px 20px 20px;
        }
        .card-eye-wrap {
          width: 52px;
          height: 34px;
          margin-top: 4px;
          margin-bottom: 8px;
        }
        .card-subtitle {
          margin-bottom: 10px;
        }
        .card-divider {
          margin-bottom: 10px;
        }
        .card-title {
          font-size: clamp(1.75rem, 8vw, 2.25rem);
          margin-bottom: 8px;
        }
        .card-pillars {
          margin-bottom: 12px;
          letter-spacing: 0.1em;
        }
        .card-meta-pill {
          margin-bottom: 14px;
          padding: 5px 12px;
        }
        .open-btn {
          padding: 10px 16px;
        }
        .invitation-panel {
          width: min(440px, 94vw);
          max-height: calc(100dvh - 24px);
        }
        .panel-top-frieze {
          height: 6px;
        }
        .panel-body {
          padding: 12px 13px 11px;
          gap: 10px;
        }
        .hero-eye {
          width: 34px;
          height: 22px;
        }
        .main-title {
          font-size: clamp(1.65rem, 7.5vw, 2.2rem);
          margin-bottom: 6px;
        }
        .hero-tagline {
          font-size: 0.84rem;
          margin-bottom: 5px;
        }
        .hero-desc {
          font-size: 0.74rem;
          line-height: 1.48;
          margin-bottom: 8px;
        }
        .hero-pillars-chip {
          padding: 4px 11px;
          font-size: 0.68rem;
        }
        .details-col {
          padding-top: 9px;
          gap: 8px;
        }
        .details-grid {
          gap: 7px;
        }
        .detail-card {
          padding: 7px 8px;
          gap: 7px;
          border-radius: 8px;
        }
        .detail-icon-box {
          width: 28px;
          height: 28px;
          border-radius: 6px;
        }
        .detail-label {
          font-size: 0.64rem;
        }
        .detail-value {
          font-size: 0.72rem;
        }
        .rsvp-slot {
          height: 38px;
          margin-top: 2px;
        }
        .rsvp-loading,
        .rsvp-success {
          height: 38px;
          font-size: 0.76rem;
          border-radius: 8px;
        }
        .replay-btn {
          padding: 4px 12px;
          font-size: 0.68rem;
        }
      }

      @media (max-height: 645px) and (max-width: 420px) {
        .royal-card {
          padding: 14px 14px 14px;
        }
        .hero-pillars-chip {
          display: none;
        }
        .panel-body {
          gap: 8px;
          padding: 10px 12px;
        }
        .details-col {
          padding-top: 7px;
          gap: 6px;
        }
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "framer-motion": "https://esm.sh/framer-motion@11.11.17?deps=react@18.3.1,react-dom@18.3.1",
          "lucide-react": "https://esm.sh/lucide-react@0.460.0?deps=react@18.3.1",
          "htm": "https://esm.sh/htm@3.1.1"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module">
      import React, { useState, useEffect, useRef, useCallback } from 'react';
      import { createRoot } from 'react-dom/client';
      import { motion, AnimatePresence } from 'framer-motion';
      import { Clock3, MapPin, CheckCircle2, Calendar, Award } from 'lucide-react';
      import htm from 'htm';

      const html = htm.bind(React.createElement);

      function EyeOfHorusIcon({ className = '' }) {
        return html`
          <svg
            viewBox="0 0 120 76"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            className=${className}
            aria-hidden="true"
          >
            <defs>
              <linearGradient id="horusGold" x1="10" y1="8" x2="110" y2="68" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stopColor="#D6AD46" />
                <stop offset="50%" stopColor="#EFD270" />
                <stop offset="100%" stopColor="#D6AD46" />
              </linearGradient>
            </defs>
            <path d="M14 24C34 10 72 8 106 20" stroke="url(#horusGold)" strokeWidth="3.2" strokeLinecap="round" />
            <path
              d="M18 36C36 22 68 22 92 34C74 47 42 48 18 36Z"
              stroke="url(#horusGold)"
              strokeWidth="2.8"
              fill="rgba(25, 118, 122, 0.16)"
            />
            <path d="M92 34L109 32L114 36" stroke="url(#horusGold)" strokeWidth="2.6" strokeLinecap="round" />
            <circle cx="114" cy="36" r="2.3" fill="#EFD270" />
            <circle cx="56" cy="35" r="9.5" stroke="url(#horusGold)" strokeWidth="2.2" fill="#19767A" />
            <circle cx="56" cy="35" r="3.6" fill="#EFD270" />
            <path d="M52 45L48 64" stroke="url(#horusGold)" strokeWidth="2.8" strokeLinecap="round" />
            <circle cx="47.5" cy="67" r="2.6" fill="#EFD270" />
            <path d="M61 44C66 56 76 62 85 57C90 54 90 48 85 46" stroke="url(#horusGold)" strokeWidth="2.6" strokeLinecap="round" />
            <circle cx="85" cy="46" r="2.2" fill="#19767A" stroke="#EFD270" strokeWidth="1.2" />
          </svg>
        `;
      }

      function PharaonicTechBackground() {
        return html`
          <div className="bg-layer">
            <div className="bg-glow-gold" />
            <div className="bg-glow-turquoise" />
            <div className="bg-tech-grid" />

            <svg className="bg-sacred-rings" viewBox="0 0 600 600" fill="none">
              <circle cx="300" cy="300" r="260" stroke="#D6AD46" strokeWidth="1" strokeDasharray="6 10" />
              <circle cx="300" cy="300" r="210" stroke="#19767A" strokeWidth="1.2" />
              <circle cx="300" cy="300" r="155" stroke="#D6AD46" strokeWidth="0.9" strokeDasharray="2 8" />
              <path d="M300 20V80 M300 520V580 M20 300H80 M520 300H580" stroke="#D6AD46" strokeWidth="1" />
              <polygon
                points="300,65 535,300 300,535 65,300"
                stroke="#19767A"
                strokeWidth="0.8"
                strokeDasharray="4 6"
              />
            </svg>

            <div className="screen-frame-top">
              <div className="frame-frieze" />
              <div className="frame-gold-line" />
            </div>

            <div className="screen-frame-bottom">
              <div className="frame-frieze" />
              <div className="frame-gold-line" />
            </div>
          </div>
        `;
      }

      function App() {
        const [stage, setStage] = useState('cover');
        const [confirmStatus, setConfirmStatus] = useState('idle');

        const openTimerRef = useRef(null);
        const confirmTimerRef = useRef(null);

        const clearAllTimers = useCallback(() => {
          if (openTimerRef.current) {
            clearTimeout(openTimerRef.current);
            openTimerRef.current = null;
          }
          if (confirmTimerRef.current) {
            clearTimeout(confirmTimerRef.current);
            confirmTimerRef.current = null;
          }
        }, []);

        useEffect(() => {
          return () => clearAllTimers();
        }, [clearAllTimers]);

        useEffect(() => {
          if (stage !== 'revealed') return;

          clearAllTimers();
          setConfirmStatus('confirming');

          confirmTimerRef.current = setTimeout(() => {
            setConfirmStatus('confirmed');
            confirmTimerRef.current = null;
          }, 1550);

          return () => {
            if (confirmTimerRef.current) {
              clearTimeout(confirmTimerRef.current);
              confirmTimerRef.current = null;
            }
          };
        }, [stage, clearAllTimers]);

        const handleOpenCard = () => {
          if (stage !== 'cover') return;
          clearAllTimers();
          setStage('opening');

          openTimerRef.current = setTimeout(() => {
            setStage('revealed');
            openTimerRef.current = null;
          }, 800);
        };

        const handleKeyDown = (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            handleOpenCard();
          }
        };

        const handleReplay = () => {
          clearAllTimers();
          setConfirmStatus('idle');
          setStage('cover');
        };

        return html`
          <main className="ict-viewport">
            <${PharaonicTechBackground} />

            <div className="stage-wrapper">
              <${AnimatePresence} mode="wait">
                ${stage !== 'revealed'
                  ? html`
                      <${motion.div}
                        key="screen-cover"
                        className="cover-container"
                        initial=${{ opacity: 0, y: 20, scale: 0.96 }}
                        animate=${{ opacity: 1, y: 0, scale: 1 }}
                        exit=${{ opacity: 0, transition: { duration: 0.08 } }}
                        transition=${{ duration: 0.65, ease: [0.22, 1, 0.36, 1] }}
                      >
                        <${motion.div}
                          animate=${stage === 'cover' ? { y: [0, -7, 0] } : { y: 0 }}
                          transition=${
                            stage === 'cover'
                              ? { duration: 4, repeat: Infinity, ease: 'easeInOut' }
                              : { duration: 0.2 }
                          }
                        >
                          <${motion.div}
                            role="button"
                            tabIndex=${0}
                            aria-label="افتح دعوة ICT DAY"
                            className="royal-card"
                            onClick=${handleOpenCard}
                            onKeyDown=${handleKeyDown}
                            animate=${
                              stage === 'opening'
                                ? { rotateY: -105, scale: 0.88, opacity: 0 }
                                : { rotateY: 0, scale: 1, opacity: 1 }
                            }
                            transition=${{ duration: 0.8, ease: [0.4, 0, 0.2, 1] }}
                            whileTap=${stage === 'cover' ? { scale: 0.98 } : undefined}
                          >
                            <div className="card-pylon-cap" />
                            <div className="card-inner-border" />
                            <span className="corner-ornament corner-tl" />
                            <span className="corner-ornament corner-tr" />
                            <span className="corner-ornament corner-bl" />
                            <span className="corner-ornament corner-br" />

                            <div className="card-eye-wrap">
                              <${EyeOfHorusIcon} />
                            </div>

                            <p className="card-college">MANSOURA COLLEGE</p>
                            <p className="card-subtitle">ROYAL INVITATION</p>

                            <div className="card-divider" />

                            <h1 className="card-title">
                              <span className="card-title-ict">ICT </span>
                              <span className="card-title-day">DAY</span>
                            </h1>

                            <p className="card-pillars">INNOVATION • TECHNOLOGY • CREATIVITY</p>

                            <div className="card-meta-pill">MMC THEATRE • 10:00 AM</div>

                            <button
                              type="button"
                              className="open-btn"
                              onClick=${(e) => {
                                e.stopPropagation();
                                handleOpenCard();
                              }}
                            >
                              OPEN INVITATION
                            </button>
                          </${motion.div}>
                        </${motion.div}>

                        <${motion.p}
                          className="cover-hint"
                          animate=${{ opacity: stage === 'opening' ? 0 : 0.9 }}
                          transition=${{ duration: 0.35 }}
                        >
                          اضغط على البطاقة لفتح الدعوة
                        </${motion.p}>
                      </${motion.div}>
                    `
                  : html`
                      <${motion.section}
                        key="screen-revealed"
                        className="invitation-panel"
                        initial=${{ opacity: 0, scale: 0.94, rotateY: 14 }}
                        animate=${{ opacity: 1, scale: 1, rotateY: 0 }}
                        exit=${{ opacity: 0, scale: 0.96, transition: { duration: 0.3 } }}
                        transition=${{ duration: 0.65, ease: [0.22, 1, 0.36, 1] }}
                      >
                        <div className="panel-top-frieze" />

                        <div className="panel-body">
                          <div className="hero-col">
                            <div className="hero-top-row">
                              <${EyeOfHorusIcon} className="hero-eye" />
                              <span className="invited-label">YOU ARE INVITED</span>
                            </div>

                            <h1 className="main-title">
                              <span className="main-title-ict">ICT </span>
                              <span className="main-title-day">DAY</span>
                            </h1>

                            <p className="hero-tagline">حيث يلتقي إلهام الماضي بتكنولوجيا المستقبل</p>

                            <p className="hero-desc">
                              انضم إلينا في يوم مميز لعرض مشروعات الطلاب وإبداعاتهم في البرمجة
                              والتكنولوجيا والابتكار داخل Mansoura College.
                            </p>

                            <div className="hero-pillars-chip">الابتكار • التكنولوجيا • الإبداع</div>
                          </div>

                          <div className="details-col">
                            <h2 className="details-heading">EVENT DETAILS</h2>

                            <div className="details-grid">
                              <div className="detail-card">
                                <div className="detail-icon-box">
                                  <${Clock3} size=${17} />
                                </div>
                                <div className="detail-text">
                                  <span className="detail-label">الوقت</span>
                                  <span className="detail-value">10:00 صباحًا</span>
                                </div>
                              </div>

                              <div className="detail-card">
                                <div className="detail-icon-box">
                                  <${MapPin} size=${17} />
                                </div>
                                <div className="detail-text">
                                  <span className="detail-label">المكان</span>
                                  <span className="detail-value">مسرح MMC</span>
                                </div>
                              </div>

                              <div className="detail-card">
                                <div className="detail-icon-box">
                                  <${Award} size=${17} />
                                </div>
                                <div className="detail-text">
                                  <span className="detail-label">تنظيم</span>
                                  <span className="detail-value">Mansoura College</span>
                                </div>
                              </div>

                              <div className="detail-card">
                                <div className="detail-icon-box">
                                  <${Calendar} size=${17} />
                                </div>
                                <div className="detail-text">
                                  <span className="detail-label">التاريخ</span>
                                  <span className="detail-value">سيتم الإعلان عنه قريبًا</span>
                                </div>
                              </div>
                            </div>

                            <div className="rsvp-slot" aria-live="polite">
                              <${AnimatePresence} mode="wait">
                                ${confirmStatus === 'confirming' &&
                                html`
                                  <${motion.div}
                                    key="rsvp-loading"
                                    className="rsvp-loading"
                                    initial=${{ opacity: 0, scale: 0.96 }}
                                    animate=${{ opacity: 1, scale: 1 }}
                                    exit=${{ opacity: 0, scale: 0.96 }}
                                    transition=${{ duration: 0.25 }}
                                  >
                                    <span className="rsvp-spinner" aria-hidden="true" />
                                    <span>جارٍ تأكيد حضورك تلقائيًا…</span>
                                  </${motion.div}>
                                `}

                                ${confirmStatus === 'confirmed' &&
                                html`
                                  <${motion.div}
                                    key="rsvp-success"
                                    className="rsvp-success"
                                    initial=${{ opacity: 0, scale: 0.92 }}
                                    animate=${{ opacity: 1, scale: 1 }}
                                    exit=${{ opacity: 0 }}
                                    transition=${{ duration: 0.35, ease: [0.22, 1, 0.36, 1] }}
                                  >
                                    <${CheckCircle2} size=${18} className="rsvp-success-icon" />
                                    <span>تم تأكيد حضورك بنجاح</span>
                                  </${motion.div}>
                                `}
                              </${AnimatePresence}>
                            </div>

                            <div className="replay-row">
                              <button type="button" className="replay-btn" onClick=${handleReplay}>
                                مشاهدة الدعوة مرة أخرى
                              </button>
                            </div>
                          </div>
                        </div>
                      </${motion.section}>
                    `}
              </${AnimatePresence}>
            </div>
          </main>
        `;
      }

      createRoot(document.getElementById('root')).render(
        html`<${React.StrictMode}><${App} /></${React.StrictMode}>`
      );
    </script>
  </body>
</html>
